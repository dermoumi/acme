name: Target Docker publish

# Split from target-docker.yml: a called workflow's jobs are permission-checked
# at startup, so verification callers would need packages: write to even start.
on:
  workflow_call:
    inputs:
      app:
        description: App directory name under apps/ (package @acme/<app>)
        required: true
        type: string

jobs:
  release:
    name: docker release identity (${{ inputs.app }})
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      short: ${{ steps.release.outputs.short }}
      tags: ${{ steps.release.outputs.tags }}
    steps:
      - name: Resolve release identity
        id: release
        env:
          APP: ${{ inputs.app }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GHCR rejects uppercase, and repository_owner preserves it
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/$APP"
          # release-please emits <app>-v<semver>
          version="${REF_NAME#"$APP-v"}"
          if [ "$version" = "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME is not $APP-v<version>"
            exit 1
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "short=${COMMIT_SHA::7}"
            echo "tags=$image:$version,$image:latest"
          } >> "$GITHUB_OUTPUT"

  build:
    name: docker publish (${{ inputs.app }}, ${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: docker-publish-${{ inputs.app }}-${{ matrix.platform }}-${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Untagged: merge tags the manifest list once both platforms are in.
      - name: Push image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ needs.release.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_NAME=${{ inputs.app }}
            APP_ENV=production
            APP_VERSION=${{ needs.release.outputs.version }}
            APP_REVISION=${{ needs.release.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$PLATFORM"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ inputs.app }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/${{ matrix.platform }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  merge:
    name: docker publish manifest (${{ inputs.app }})
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-publish-${{ inputs.app }}-${{ github.ref_name }}
    env:
      IMAGE: ${{ needs.release.outputs.image }}
      TAGS: ${{ needs.release.outputs.tags }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ inputs.app }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push multi-arch manifest
        run: |
          set -euo pipefail
          args=()
          IFS=, read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            args+=(-t "$tag")
          done
          for file in "$RUNNER_TEMP"/digests/*; do
            args+=("$IMAGE@$(cat "$file")")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Report pushed tags
        run: |
          set -euo pipefail
          # tee so it lands in the log too: the step summary is web-only.
          printf 'pushed:\n%s\n' "${TAGS//,/$'\n'}" |
            tee -a "$GITHUB_STEP_SUMMARY"
