name: Deploy Posy (staging)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - apps/posy/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/target-cloudflare.yml
      - .github/workflows/posy-deploy-staging.yml
      - .github/actions/setup/**
  push:
    branches: [main]
    paths:
      - apps/posy/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/target-cloudflare.yml
      - .github/workflows/posy-deploy-staging.yml
      - .github/actions/setup/**

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && !startsWith(github.head_ref, 'release-please--')
    permissions:
      contents: read
    uses: ./.github/workflows/target-cloudflare.yml # zizmor: ignore[secrets-inherit]
    with:
      app: posy
      environment: preview
      branch: ${{ github.head_ref }}
      workers-subdomain: posy-stg
      d1: true
    secrets: inherit

  preview-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    name: Delete preview worker and database
    runs-on: ubuntu-latest
    environment: posy-staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve names
        id: names
        uses: ./.github/actions/resolve-names
        with:
          app: posy
          branch: ${{ github.head_ref }}

      # env context (unlike secrets) is allowed in a step-level if
      - name: Delete worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/posy
        env:
          SLUG: ${{ steps.names.outputs.slug }}
        run: pnpm exec wrangler delete --name "$SLUG" || true

      # runs even if the worker delete failed, so a stuck worker cannot leak the database
      - name: Delete database
        if: always() && env.CLOUDFLARE_API_TOKEN != ''
        uses: ./.github/actions/delete-d1
        with:
          app: posy
          name: ${{ steps.names.outputs.db }}

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/target-cloudflare.yml # zizmor: ignore[secrets-inherit]
    with:
      app: posy
      environment: staging
      url: https://staging.posy-stg.workers.dev
      d1: true
    secrets: inherit
