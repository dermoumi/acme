name: Target Docker

# One target among several; apps pick theirs. Inputs are deliberately
# docker-specific rather than a shared interface across targets.
on:
  workflow_call:
    inputs:
      app:
        description: App directory name under apps/ (package @acme/<app>)
        required: true
        type: string
      health-path:
        description: Health endpoint path. Empty disables the probe.
        default: /health
        type: string
      push:
        description: >-
          Publish to GHCR as a multi-arch image. Releases only: the tag name
          supplies the version, so callers set this from a tag trigger.
        default: false
        type: boolean

jobs:
  run:
    name: docker run (${{ inputs.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: docker-run-${{ inputs.app }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      APP: ${{ inputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve build identity
        id: revision
        working-directory: apps/${{ inputs.app }}
        env:
          # on a PR, github.sha is the synthetic merge commit, not what was pushed
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "short=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // "dev"' package.json)" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          # buildx cannot load a manifest list, so this is the native arch only
          load: true
          push: false
          tags: ${{ inputs.app }}:ci
          build-args: |
            APP_NAME=${{ inputs.app }}
            APP_ENV=production
            APP_VERSION=${{ steps.revision.outputs.version }}
            APP_REVISION=${{ steps.revision.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        env:
          TAG: ${{ inputs.app }}:ci
        run: |
          set -euo pipefail
          bytes=$(docker image inspect --format '{{.Size}}' "$TAG")
          # tee so it lands in the log too: the step summary is web-only.
          printf '%s image size: %s MB\n' "$TAG" "$((bytes / 1024 / 1024))" |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start container
        env:
          TAG: ${{ inputs.app }}:ci
        run: docker run -d --name "$APP" -p 3000:3000 "$TAG"

      - name: Probe
        if: inputs.health-path != ''
        uses: ./.github/actions/probe-app
        with:
          base-url: http://localhost:3000
          health-path: ${{ inputs.health-path }}
          revision: ${{ steps.revision.outputs.short }}
          check-client: "true"
          timeout-seconds: "60"

      - name: Container logs
        if: failure()
        run: docker logs "$APP" || true

      - name: Remove container
        if: always()
        run: docker rm -fv "$APP" || true

  compose:
    name: docker compose (${{ inputs.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: docker-compose-${{ inputs.app }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      COMPOSE_FILE: apps/${{ inputs.app }}/compose.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Covers the compose file, the named volume and the published port. It
      # runs the same default command as the job above, not a second code path.
      - name: Start stack
        run: docker compose -f "$COMPOSE_FILE" up -d --build --wait

      - name: Probe
        if: inputs.health-path != ''
        uses: ./.github/actions/probe-app
        with:
          base-url: http://localhost:3000
          health-path: ${{ inputs.health-path }}
          check-client: "true"
          timeout-seconds: "60"

      - name: Stack logs
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs || true

      - name: Stop stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v || true

  publish:
    name: publish ${{ inputs.app }}
    if: inputs.push
    needs: [run, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-publish-${{ inputs.app }}-${{ github.ref_name }}
    env:
      APP: ${{ inputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release identity
        id: release
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GHCR rejects uppercase, and repository_owner preserves it
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/$APP"
          # release-please emits <app>-v<semver>
          version="${REF_NAME#"$APP-v"}"
          if [ "$version" = "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME is not $APP-v<version>"
            exit 1
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "short=${COMMIT_SHA::7}"
            echo "tags=$image:$version,$image:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # A single platform can be loaded where a manifest list cannot, so arm64
      # is built and actually run here rather than pushed untested.
      - name: Build arm64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ inputs.app }}:arm64
          build-args: |
            APP_NAME=${{ inputs.app }}
            APP_ENV=production
            APP_VERSION=${{ steps.release.outputs.version }}
            APP_REVISION=${{ steps.release.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start arm64 container
        env:
          TAG: ${{ inputs.app }}:arm64
        run: docker run -d --platform linux/arm64 --name "$APP-arm64" -p 3000:3000 "$TAG"

      - name: Probe arm64
        if: inputs.health-path != ''
        uses: ./.github/actions/probe-app
        with:
          base-url: http://localhost:3000
          health-path: ${{ inputs.health-path }}
          revision: ${{ steps.release.outputs.short }}
          check-client: "true"
          # emulated, so it starts an order of magnitude slower than native
          timeout-seconds: "300"

      - name: arm64 logs
        if: failure()
        run: docker logs "$APP-arm64" || true

      - name: Remove arm64 container
        if: always()
        run: docker rm -fv "$APP-arm64" || true

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            APP_NAME=${{ inputs.app }}
            APP_ENV=production
            APP_VERSION=${{ steps.release.outputs.version }}
            APP_REVISION=${{ steps.release.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report pushed tags
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          set -euo pipefail
          # tee so it lands in the log too: the step summary is web-only.
          printf 'pushed:\n%s\n' "${TAGS//,/$'\n'}" |
            tee -a "$GITHUB_STEP_SUMMARY"
