name: Target Docker publish

# Split from target-docker.yml: a called workflow's jobs are permission-checked
# at startup, so verification callers would need packages: write to even start.
on:
  workflow_call:
    inputs:
      app:
        description: App directory name under apps/ (package @acme/<app>)
        required: true
        type: string

jobs:
  publish:
    name: docker publish (${{ inputs.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-publish-${{ inputs.app }}-${{ github.ref_name }}
    env:
      APP: ${{ inputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release identity
        id: release
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GHCR rejects uppercase, and repository_owner preserves it
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/$APP"
          # release-please emits <app>-v<semver>
          version="${REF_NAME#"$APP-v"}"
          if [ "$version" = "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME is not $APP-v<version>"
            exit 1
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "short=${COMMIT_SHA::7}"
            echo "tags=$image:$version,$image:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            APP_NAME=${{ inputs.app }}
            APP_ENV=production
            APP_VERSION=${{ steps.release.outputs.version }}
            APP_REVISION=${{ steps.release.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report pushed tags
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          set -euo pipefail
          # tee so it lands in the log too: the step summary is web-only.
          printf 'pushed:\n%s\n' "${TAGS//,/$'\n'}" |
            tee -a "$GITHUB_STEP_SUMMARY"
