packages:
  - "apps/*"
  - "packages/*"

# 2 days in minutes, matches renovate's
minimumReleaseAge: 2880

catalog:
  "@cloudflare/vite-plugin": "1.54.7"
  "@hono/node-server": "2.1.1"
  "@cloudflare/vitest-pool-workers": "0.22.0"
  "@cloudflare/workers-types": "5.20260910.1"
  "@sentry/cloudflare": "10.74.0"
  "@sentry/core": "10.74.0"
  "@sentry/node": "10.74.0"
  "@sentry/react": "10.74.0"
  "@sentry/vite-plugin": "5.4.0"
  "@types/better-sqlite3": "9.6.0"
  "@types/node": "24.13.4"
  "@types/pg": "8.23.1"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@vitejs/plugin-react": "6.1.1"
  "@vitest/coverage-istanbul": "5.0.0"
  better-sqlite3: "13.0.3"
  cac: "7.0.0"
  hono: "4.13.7"
  hono-rate-limiter: "0.5.4"
  husky: "9.1.7"
  kysely: "0.29.5"
  kysely-d1: "0.4.0"
  oxfmt: "0.67.0"
  oxlint: "1.78.0"
  oxlint-tsgolint: "7.0.2001"
  pg: "8.23.0"
  react: "19.3.0"
  react-dom: "19.3.0"
  tsx: "4.23.13"
  turbo: "2.10.12"
  typescript: "7.0.2"
  valibot: "1.5.0"
  vite: "8.3.0"
  vite-plugin-pwa: "1.3.0"
  vitest: "5.0.0"
  workbox-window: "7.4.1"
  wouter: "3.11.0"
  wrangler: "4.131.0"

allowBuilds:
  # downloads the sentry-cli binary, which @sentry/vite-plugin shells out to
  "@sentry/cli": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
