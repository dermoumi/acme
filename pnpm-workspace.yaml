packages:
  - "apps/*"
  - "packages/*"

# 2 days in minutes, matches renovate's
minimumReleaseAge: 2880

catalog:
  "@cloudflare/vite-plugin": "1.64.0"
  "@hono/node-server": "2.1.5"
  "@cloudflare/vitest-plugin": "1.4.2"
  "@cloudflare/workers-types": "5.20261014.1"
  "@react-router/dev": "8.4.0"
  "@sentry/cloudflare": "11.7.0"
  "@sentry/core": "11.7.0"
  "@sentry/node": "11.7.0"
  "@sentry/react": "11.7.0"
  "@sentry/vite-plugin": "5.4.1"
  "@types/better-sqlite3": "9.6.0"
  "@types/node": "24.19.2"
  "@types/pg": "8.23.1"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@vitest/coverage-istanbul": "4.1.11"
  better-sqlite3: "13.0.3"
  cac: "7.1.0"
  hono: "4.13.13"
  hono-rate-limiter: "0.5.4"
  husky: "9.1.7"
  isbot: "5.2.2"
  kysely: "0.29.6"
  kysely-d1: "0.4.0"
  oxfmt: "0.73.0"
  oxlint: "1.88.0"
  oxlint-tsgolint: "7.0.2004"
  pg: "8.23.1"
  react: "19.3.0"
  react-dom: "19.3.0"
  react-router: "8.4.0"
  tsx: "4.23.15"
  turbo: "2.11.8"
  typescript: "7.0.2"
  valibot: "1.5.0"
  vite: "8.3.4"
  vite-plugin-pwa: "2.0.0"
  vitest: "4.1.11"
  workbox-window: "7.4.1"
  wrangler: "4.151.0"

allowBuilds:
  # downloads the sentry-cli binary, which @sentry/vite-plugin shells out to
  "@sentry/cli": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
