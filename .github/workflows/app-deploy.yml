name: App Deploy

on:
  workflow_call:
    inputs:
      app:
        description: App directory name under apps/ (package @acme/<app>)
        required: true
        type: string
      environment:
        description: Deploy tier (preview | staging | production)
        required: true
        type: string
      branch:
        description: Head branch, slugified into the preview worker name
        required: false
        type: string
        default: ""
      health-url:
        description: URL to probe after deploy (skipped when empty)
        required: false
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Workers-edit token, from the target environment's CF account
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: CF account id matching the token's environment
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.app }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.app }}-${{ inputs.environment == 'production' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.environment }}${{ inputs.branch && '-' || '' }}${{ inputs.branch }}
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
      APP: ${{ inputs.app }}
      DEPLOY_ENV: ${{ inputs.environment }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        env:
          # preview builds use the staging env config under a per-branch worker name
          CLOUDFLARE_ENV: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
        run: pnpm exec turbo build --filter="@acme/$APP"

      - name: Deploy
        working-directory: apps/${{ inputs.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$DEPLOY_ENV" = "preview" ]; then
            slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)
            # "staging" shares the account with previews; "" would be an invalid name
            case "$slug" in staging | "") slug="branch-$slug" ;; esac
            pnpm exec wrangler deploy --name "$slug"
          else
            pnpm exec wrangler deploy
          fi

      - name: Health check
        if: inputs.health-url != ''
        env:
          HEALTH_URL: ${{ inputs.health-url }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$HEALTH_URL"
