name: Posy docker (production)

# Separate from posy-docker.yml: paths and tags in one push block silently
# skips the tag runs.
on:
  push:
    tags: ["posy-v*"]

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/target-docker.yml
    with:
      app: posy
      push: true
