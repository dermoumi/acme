name: Deploy to Cloudflare

# One target among several; apps pick theirs. Inputs are deliberately
# Cloudflare-specific rather than a shared interface across targets.
on:
  workflow_call:
    inputs:
      app:
        description: App directory name under apps/ (package @acme/<app>)
        required: true
        type: string
      environment:
        description: Deploy tier (preview | staging | production)
        required: true
        type: string
      branch:
        description: Head branch, slugified into the preview worker name
        required: false
        type: string
        default: ""
      url:
        description: Public base URL; shown on the GitHub environment and health-checked
        required: false
        type: string
        default: ""
      workers-subdomain:
        description: Account workers.dev subdomain; enables preview URLs + health checks
        required: false
        type: string
        default: ""
      health-path:
        description: >-
          Path probed after deploy; empty disables the check. When set, the job fails
          unless a url resolves from "url" or, for previews, "workers-subdomain".
        required: false
        type: string
        default: "/health"
      d1:
        description: >-
          Whether this app has a D1 database; false skips every D1 step. Staging and
          production take the name from the built config, previews use "<app>-<slug>".
          Apps enabling this must expose a "migrate" script that accepts an optional
          database id. Production is never created automatically.
        required: false
        type: boolean
        default: false
      seed:
        description: >-
          Run "pnpm seed <database-id>" on first database creation for
          non-production environments. The app must expose the script.
        required: false
        type: boolean
        default: false
      sentry-org:
        description: Sentry org for source-map upload; defaults to the repository owner
        required: false
        type: string
        default: ""
      sentry-project:
        description: Sentry project for source-map upload; defaults to the app name
        required: false
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Workers-edit token, from the target environment's CF account
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: CF account id matching the token's environment
        required: true
      BASIC_AUTH:
        description: Basic-auth users ("user:pass" per line) gating preview/staging
        required: false
      SENTRY_DSN:
        description: Sentry ingestion key; absent means the deploy is unmonitored
        required: false
      SENTRY_AUTH_TOKEN:
        description: Sentry upload token; absent skips source-map upload
        required: false

jobs:
  deploy:
    name: Deploy ${{ inputs.app }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.app }}-${{ inputs.environment == 'production' && 'production' || 'staging' }}
      url: ${{ inputs.url != '' && inputs.url || steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.environment }}${{ inputs.branch && '-' || '' }}${{ inputs.branch }}
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
      APP: ${{ inputs.app }}
      DEPLOY_ENV: ${{ inputs.environment }}
      BRANCH: ${{ inputs.branch }}
      # job-level so the env context can gate steps; secrets cannot be read in an if
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # forks legitimately have no secrets, but skipping staging or production would
      # report success while deploying nothing
      - name: Check credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          if [ "$DEPLOY_ENV" = "preview" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN, skipping deploy steps."
          else
            echo "::error::No CLOUDFLARE_API_TOKEN for the $DEPLOY_ENV environment"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve preview names
        id: names
        if: inputs.environment == 'preview'
        uses: ./.github/actions/resolve-names
        with:
          app: ${{ inputs.app }}
          branch: ${{ inputs.branch }}

      - name: Resolve build identity
        id: revision
        working-directory: apps/${{ inputs.app }}
        env:
          # on a PR, github.sha is the synthetic merge commit, not what was pushed
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "short=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // "dev"' package.json)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          # preview builds use the staging env config under a per-branch worker name
          CLOUDFLARE_ENV: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
          # the client bakes these in; the deploy passes the same values to the worker
          APP_NAME: ${{ inputs.app }}
          # the client SDK bakes its tier in, so previews stay out of staging's events
          APP_ENV: ${{ inputs.environment }}
          APP_REVISION: ${{ steps.revision.outputs.short }}
          # uploaded maps are keyed by these, so the deploy must report the same pair
          APP_VERSION: ${{ steps.revision.outputs.version }}
          # absent disables source-map upload; the build still succeeds
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ inputs.sentry-org || github.repository_owner }}
          SENTRY_PROJECT: ${{ inputs.sentry-project || inputs.app }}
        run: pnpm exec turbo build --filter="@acme/$APP"

      - name: Provision D1 database
        id: d1
        if: inputs.d1 && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/${{ inputs.app }}
        env:
          PREVIEW_DB: ${{ steps.names.outputs.db }}
        run: |
          set -euo pipefail
          # wrangler deploys the built config, not wrangler.jsonc; this is where it points
          config=$(realpath ".wrangler/deploy/$(jq -r .configPath .wrangler/deploy/config.json)")

          if [ "$DEPLOY_ENV" = "preview" ]; then
            db_name="$PREVIEW_DB"
          else
            db_name=$(jq -r '.d1_databases[0].database_name' "$config")
          fi

          # first/// keeps this a single value: a multi-line id would silently corrupt
          # the config patch below
          find_id() {
            pnpm exec wrangler d1 list --json |
              jq -r --arg n "$db_name" '(if type == "object" then .result else . end)
                                        | map(select(.name == $n))
                                        | (first // {}) | .uuid // empty'
          }

          db_id=$(find_id)
          if [ -z "$db_id" ]; then
            if [ "$DEPLOY_ENV" = "production" ]; then
              echo "::error::production database '$db_name' does not exist. Create it deliberately with: wrangler d1 create $db_name"
              exit 1
            fi
            pnpm exec wrangler d1 create "$db_name" >/dev/null
            # re-list instead of parsing create's output, which is not machine-readable
            db_id=$(find_id)
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$db_id" ]; then
            echo "::error::could not resolve an id for D1 database '$db_name'"
            exit 1
          fi

          jq --arg n "$db_name" --arg id "$db_id" \
            '.d1_databases[0].database_name = $n | .d1_databases[0].database_id = $id' \
            "$config" > "$config.tmp"
          mv "$config.tmp" "$config"

          echo "name=$db_name" >> "$GITHUB_OUTPUT"
          echo "id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Capture D1 restore point
        if: inputs.d1 && inputs.environment != 'preview' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/${{ inputs.app }}
        env:
          DB_NAME: ${{ steps.d1.outputs.name }}
          DB_CREATED: ${{ steps.d1.outputs.created }}
        run: |
          set -euo pipefail
          # D1 has no transactions, so a failed migration leaves partial state; this is
          # the manual way back. Restoring is never automatic.
          if [ "$DB_CREATED" = "true" ]; then
            echo "\`$DB_NAME\` was just created; nothing to restore." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          info=$(pnpm exec wrangler d1 time-travel info "$DB_NAME" --json)
          bookmark=$(printf '%s' "$info" | jq -r '.bookmark // .result.bookmark // empty')
          {
            echo "### D1 restore point"
            if [ -n "$bookmark" ]; then
              echo "Database \`$DB_NAME\` before migrating:"
              echo '```'
              echo "wrangler d1 time-travel restore $DB_NAME --bookmark=$bookmark"
              echo '```'
            else
              echo "Could not read a bookmark for \`$DB_NAME\`. Raw output:"
              echo '```'
              printf '%s\n' "$info"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply D1 migrations
        if: inputs.d1 && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/${{ inputs.app }}
        env:
          DB_ID: ${{ steps.d1.outputs.id }}
        run: pnpm migrate "$DB_ID"

      - name: Seed D1 database
        if: inputs.seed && steps.d1.outputs.created == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/${{ inputs.app }}
        env:
          DB_ID: ${{ steps.d1.outputs.id }}
        run: pnpm seed "$DB_ID"

      - name: Deploy
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/${{ inputs.app }}
        env:
          WORKERS_SUBDOMAIN: ${{ inputs.workers-subdomain }}
          BASIC_AUTH: ${{ secrets.BASIC_AUTH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_REVISION: ${{ steps.revision.outputs.short }}
          APP_VERSION: ${{ steps.revision.outputs.version }}
          SLUG: ${{ steps.names.outputs.slug }}
        run: |
          extra_args=()
          # the worker fails closed (503) when staging deploys without this var
          if [ "$DEPLOY_ENV" != "production" ] && [ -n "$BASIC_AUTH" ]; then
            extra_args+=(--var "BASIC_AUTH:$BASIC_AUTH")
          fi
          # named env blocks replace the top-level vars rather than extending them,
          # so everything the worker needs at runtime is passed here
          extra_args+=(--var "APP_NAME:$APP")
          extra_args+=(--var "APP_ENV:$DEPLOY_ENV")
          extra_args+=(--var "APP_REVISION:$APP_REVISION")
          extra_args+=(--var "APP_VERSION:$APP_VERSION")
          # injected, never committed; absent just means this deploy is unmonitored
          if [ -n "$SENTRY_DSN" ]; then
            extra_args+=(--var "SENTRY_DSN:$SENTRY_DSN")
          fi
          if [ "$DEPLOY_ENV" = "preview" ]; then
            pnpm exec wrangler deploy --name "$SLUG" "${extra_args[@]}"
            if [ -n "$WORKERS_SUBDOMAIN" ]; then
              echo "url=https://$SLUG.$WORKERS_SUBDOMAIN.workers.dev" >> "$GITHUB_OUTPUT"
            fi
          else
            pnpm exec wrangler deploy "${extra_args[@]}"
          fi

      - name: Health check
        if: env.CLOUDFLARE_API_TOKEN != '' && inputs.health-path != ''
        env:
          BASE_URL: ${{ inputs.url != '' && inputs.url || steps.deploy.outputs.url }}
          HEALTH_PATH: ${{ inputs.health-path }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_REVISION: ${{ steps.revision.outputs.short }}
        run: |
          # asking for a probe that cannot run is a config bug, so fail rather than skip
          if [ -z "$BASE_URL" ]; then
            echo "::error::health-path is set but no url resolved; pass url, or workers-subdomain for previews"
            exit 1
          fi
          # curl --retry only retries failures, and the PREVIOUS deployment answering
          # 200 is not a failure, so waiting on the revision is what makes this check
          # about the build we just shipped. Also covers a cold preview route 404ing.
          deadline=$((SECONDS + 120))
          while :; do
            body=$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --user-agent "acme-ci-health-probe" \
              "$BASE_URL$HEALTH_PATH" || true)
            served=$(printf '%s' "$body" | jq -r '.revision // empty' 2>/dev/null || true)
            if [ "$served" = "$APP_REVISION" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$HEALTH_PATH never served revision $APP_REVISION (last: ${served:-no response})"
              exit 1
            fi
            sleep 5
          done
          echo "$body"

          # Capture is fail-soft, so a dsn that never reached the worker is silent.
          # Only assert when one was supplied: no secret stays a legitimate deploy.
          if [ -n "$SENTRY_DSN" ] &&
             ! printf '%s' "$body" | grep -qE '"sentry" *: *"configured"'; then
            echo "::error::SENTRY_DSN is set but $HEALTH_PATH does not report sentry as configured"
            exit 1
          fi
