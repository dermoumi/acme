name: Cleanup Posy preview

# No paths filter: it would strand previews made by workflows that have none (posy-reset-db.yml)
on:
  pull_request:
    types: [closed]

jobs:
  preview-cleanup:
    name: Delete preview worker and database
    runs-on: ubuntu-latest
    environment: posy-preview
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve names
        id: names
        uses: ./.github/actions/resolve-names
        with:
          app: posy
          branch: ${{ github.head_ref }}

      # env context (unlike secrets) is allowed in a step-level if
      - name: Delete worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/posy
        env:
          SLUG: ${{ steps.names.outputs.slug }}
        run: pnpm exec wrangler delete --name "$SLUG" || true

      - name: Delete database
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: ./.github/actions/delete-d1
        with:
          app: posy
          name: ${{ steps.names.outputs.db }}
